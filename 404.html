<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found</title>
<script>
// GitHub Pages paths are case-sensitive; phones often capitalise typed links
// (/Newai). Retry once in lowercase before showing the not-found page.
(function(){var p=location.pathname,l=p.toLowerCase();if(p!==l)location.replace(l+location.search+location.hash);})();
</script>

</head><body><div><h1 style="font-weight:500">Page not found</h1><p><a href="/">stevenlava.com</a></p></div></body></html>
