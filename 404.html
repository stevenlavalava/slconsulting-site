<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found · Steven Lava</title>
<script>
  // GitHub Pages paths are case-sensitive: /NewAI 404s while /newai works.
  // Retry with the path's canonical casing before showing "not found".
  (function () {
    // Folders whose real name is not all lowercase.
    var MIXED_CASE = ["PAIAsetup"];
    var path = location.pathname;
    var fixed = path.toLowerCase();
    for (var i = 0; i < MIXED_CASE.length; i++) {
      var name = MIXED_CASE[i];
      if (fixed === "/" + name.toLowerCase() || fixed.indexOf("/" + name.toLowerCase() + "/") === 0) {
        fixed = "/" + name + fixed.slice(name.length + 1);
      }
    }
    if (fixed !== path) location.replace(fixed + location.search + location.hash);
  })();
</script>
