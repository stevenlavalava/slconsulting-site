async function unlock(pw) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(BLOB.s), iterations:BLOB.n, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);

async function attempt(pw, quiet) {
  const err = document.getElementById('err');
  try { await unlock(pw); } catch (e) { if (!quiet) err.textContent = 'That password did not open the page. Check the message and try again.'; }

document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); attempt(document.getElementById('pw').value.trim(), false); });
